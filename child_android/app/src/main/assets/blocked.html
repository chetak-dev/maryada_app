<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(150deg, #4338CA 0%, #6D28D9 55%, #7C3AED 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 26px 96px;
      min-height: 100%;
      overflow: hidden;
    }
    .badge {
      width: 132px; height: 132px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px;
    }
    .badge img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 27px; font-weight: 800; letter-spacing: 0.2px; margin-bottom: 14px; }
    p.msg { font-size: 17px; line-height: 1.55; color: #E9E7FD; max-width: 440px; margin-bottom: 10px; }
    .host {
      font-size: 13px; color: #CBBEF9; word-break: break-all;
      max-width: 420px; margin-bottom: 34px; min-height: 16px; opacity: 0.95;
    }
    button {
      appearance: none; border: none; cursor: pointer;
      background: #ffffff; color: #4C1D95;
      font-size: 17px; font-weight: 700;
      border-radius: 16px; padding: 16px 46px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      transition: transform 0.05s ease;
    }
    button:active { transform: translateY(1px) scale(0.99); }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    button.ghost {
      background: rgba(255,255,255,0.16); color: #ffffff;
      box-shadow: none; border: 1px solid rgba(255,255,255,0.35);
    }
    .footer {
      position: fixed; left: 0; right: 0; bottom: 22px;
      font-size: 12px; font-weight: 600; color: #CBBEF9; opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="badge"><img src="logo.png" alt="" /></div>
  <h1 id="title">Website Blocked</h1>
  <p class="msg">Hare Krishna, this website may not be safe for you.</p>
  <div class="host" id="host"></div>
  <div class="actions">
    <button id="backBtn" onclick="onBack()">Go Back</button>
    <button id="homeBtn" class="ghost" onclick="onHome()">Go home</button>
  </div>
  <div class="footer">Made with ❤️ by ISKCON Brahmapur</div>

  <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var site = params.get('site');
        var msg = params.get('msg');
        var title = params.get('title');
        if (msg) { document.querySelector('.msg').textContent = decodeURIComponent(msg); }
        if (site) { document.getElementById('host').textContent = decodeURIComponent(site); }
        if (title) { document.getElementById('title').textContent = decodeURIComponent(title); }
      } catch (e) {}
    })();
    function onBack() {
      if (window.Android && window.Android.goBack) { window.Android.goBack(); }
      else { history.back(); }
    }
    function onHome() {
      if (window.Android && window.Android.goHome) { window.Android.goHome(); }
    }
  </script>
</body>
</html>
